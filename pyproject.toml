[project]
name = "agent-manager"
version = "0.1.0"
description = "Task-oriented agent system"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14",
    "aiogram>=3.17",
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
agent-manager = "agent_manager:main"
pi-runner = "pi_runner.cli:main"
runner = "pi_runner.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
